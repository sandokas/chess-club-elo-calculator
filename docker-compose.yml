services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 10s
      start_interval: 500ms

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # See Dockerfile: defaults to 1000:1000 (works for Windows/macOS and
        # Linux with default first-user UID). Override on Linux hosts whose
        # user is not 1000:1000 by running:
        #   UID=$(id -u) GID=$(id -g) docker compose build
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "node"
    working_dir: /workspace
    # Self-healing startup: `pnpm install --prefer-offline` is a no-op (~1s) when
    # the anonymous volume is consistent, and transparently re-syncs missing or
    # drifted deps after a `docker compose restart`. Without it, a damaged
    # anonymous volume (e.g. partial install from a previous run) leaves the
    # container permanently broken until volumes are nuked.
    command: sh -c "pnpm install --prefer-offline && pnpm --filter @chess-club/db db:migrate && pnpm --filter @chess-club/api exec tsx src/server.ts"
    environment:
      # Quiets pnpm's interactive purge prompt; pnpm treats CI=true as
      # "non-interactive, never auto-purge".
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?set SESSION_COOKIE_SECRET in .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID in .env}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?set GOOGLE_OAUTH_CLIENT_SECRET in .env}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:?set OAUTH_REDIRECT_URL in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      # Anonymous volumes mask the host's node_modules dirs so the container
      # gets its own Linux-compatible installs, decoupled from whatever
      # platform-specific binaries the host has.
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/config/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # See api service above.
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    user: "node"
    working_dir: /workspace
    # See api service comment about self-healing startup.
    command: sh -c "pnpm install --prefer-offline && pnpm --filter @chess-club/web dev --host 0.0.0.0"
    environment:
      CI: "true"
      npm_config_verify_deps_before_run: "false"
      VITE_API_TARGET: http://api:4000
      VITE_WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
      # Polling FS watcher. Required on Windows/macOS Docker Desktop bind mounts.
      # Linux hosts can override to "false" in their shell or a compose override
      # file (`CHOKIDAR_USEPOLLING=false docker compose up -d`) to save CPU.
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
