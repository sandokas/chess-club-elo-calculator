services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1s
      timeout: 3s
      retries: 30
      start_period: 10s
      start_interval: 500ms

  api:
    build:
      context: .
      dockerfile: Dockerfile
    user: "node"
    working_dir: /workspace
    command: sh -c "pnpm --filter @chess-club/db db:migrate && pnpm --filter @chess-club/api exec tsx src/server.ts"
    environment:
      # Quiets pnpm's interactive purge prompt; pnpm treats CI=true as
      # "non-interactive, never auto-purge".
      CI: "true"
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      API_HOST: 0.0.0.0
      API_PORT: 4000
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:?set SESSION_COOKIE_SECRET in .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?set GOOGLE_OAUTH_CLIENT_ID in .env}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?set GOOGLE_OAUTH_CLIENT_SECRET in .env}
      OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:?set OAUTH_REDIRECT_URL in .env}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-}
      WEB_BASE_URL: ${WEB_BASE_URL:?set WEB_BASE_URL in .env}
    ports:
      - "4000:4000"
    volumes:
      - .:/workspace
      # Anonymous volumes mask the host's node_modules dirs so the container
      # gets its own Linux-compatible installs, decoupled from whatever
      # platform-specific binaries the host has.
      - /workspace/node_modules
      - /workspace/apps/api/node_modules
      - /workspace/packages/db/node_modules
      - /workspace/packages/config/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    user: "node"
    working_dir: /workspace
    command: sh -c "pnpm --filter @chess-club/web dev --host 0.0.0.0"
    environment:
      CI: "true"
      npm_config_verify_deps_before_run: "false"
      VITE_API_TARGET: http://api:4000
    ports:
      - "5173:5173"
    volumes:
      - .:/workspace
      - /workspace/node_modules
      - /workspace/apps/web/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
